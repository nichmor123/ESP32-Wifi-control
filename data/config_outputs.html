<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Config - Outputs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
</head>

<body id="page-config-outputs">

<div class="layout">

  <!-- Left Navigation -->
  <aside class="nav">

    <div class="navTitle">Controller</div>

    <a href="/">Main</a>
    <a href="/mobile">Mobile Control</a>
    <a href="/config/inputs">Input Mapping</a>
    <a href="/config/outputs">Output Mapping</a>
        <a href="/battery">Battery</a>
    <a href="/troubleshooting">Troubleshooting</a>
    <a href="/settings">Settings</a>

  </aside>

  <!-- Main Content -->
  <main class="page">

    <div class="card" style="max-width: 860px;">

      <h1>Config: Outputs</h1>
      <p class="subtitle">Configure how channels map to hardware outputs</p>
      
            <div class="status" id="status">Disconnected</div>

            <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top: 14px; align-items: center;">
        <label for="profileSelect">Active Profile:</label>
        <select id="profileSelect" style="min-width: 150px;"></select>
        <button id="newProfileBtn" style="background: #2a2a2a; color: #fff; padding: 6px 12px; font-size: 14px;">+ New</button>
        <button id="deleteProfileBtn" style="background: #ff4444; color: #fff; padding: 6px 12px; font-size: 14px; border:none; border-radius:4px; cursor:pointer;">Delete</button>
      </div>
      
      <div class="grid" id="outputGrid">
        <!-- Output cards will be generated here -->
      </div>

                        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top: 14px;">
        <button id="downloadOutputProfileBtn" style="background: #444; color: #fff;">Download File</button>
        <button id="uploadOutputProfileBtn" style="background: #444; color: #fff;">Upload File</button>
      </div>

      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top: 14px;">
        <button id="addOutputBtn">+ Add Output</button>
        <button id="saveOutputsBtn">Save Outputs to ESP32</button>
      </div>

      <div class="log" id="debug"></div>

    </div>

  </main>

</div>

<script src="/utils.js"></script>
<script src="/websocket.js"></script>
<script src="/controlMap.js"></script> <!-- Needed for channel count -->
<script src="/page-config-outputs.js"></script>
<script src="/app.js"></script>

</body>
</html>
