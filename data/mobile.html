<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mobile Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="/style.css">
</head>

<body class="mobile-body">

<!-- Status indicator -->
<div id="mobile-status-container">
    <div id="status-dot"></div>
    <div id="status">Connecting...</div>
</div>

<!-- Touch controls overlay -->
<div id="touch-controls">
    <div id="joystick-left-container" class="joystick-container"></div>
    <div id="joystick-right-container" class="joystick-container"></div>
    <div id="button-a" class="touch-button">A</div>
    <div id="button-b" class="touch-button">B</div>
</div>

<!-- NippleJS Library -->
<script src="/nipplejs.js"></script>

<!-- Project Scripts -->
<script src="/utils.js"></script>
<script src="/websocket.js"></script>
<script src="/page-mobile.js"></script>
<script src="/app.js"></script>

</body>
</html>
