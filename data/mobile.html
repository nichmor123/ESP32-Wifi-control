<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mobile Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>

<body id="page-mobile" class="mobile-body">

<!-- Status indicator -->
<div id="mobile-status-container">
    <div id="status-dot"></div>
    <div id="status">Connecting...</div>
    <div id="battery-indicator" class="battery-indicator" style="display: none;">
    <div class="battery-bar-outer"><div class="battery-bar-fill green" style="width: 100%;"></div></div>
    <div class="battery-text">-- V</div>
</div>
</div>

<!-- Touch controls overlay -->
<div id="touch-controls">
    <div id="joystick-left-container" class="joystick-container"></div>
    <div id="joystick-right-container" class="joystick-container"></div>
    <div id="button-a" class="touch-button">A</div>
    <div id="button-b" class="touch-button">B</div>
</div>

<!-- NippleJS Library -->
<script src="/lib/nipplejs.js"></script>

<!-- Project Scripts -->
<script src="/js/utils.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/websocket.js"></script>
<script src="/js/controlMap.js"></script>
<script src="/js/gamepad.js"></script>
<script src="/pages/page-mobile.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
